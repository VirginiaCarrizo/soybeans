  <h1>SoybeanSeed</h1>

  <!-- Selector de archivo en lugar de cámara -->
  <input type="file" id="fileInput" accept="image/*" />

  <!-- Controles para umbrales -->
  <div id="controles">
    <label for="sliderConf">
      Confianza: <span id="labelConf">0.50</span>
    </label>
    <input type="range" id="sliderConf" min="0" max="1" step="0.01" value="0.50" />

    <label for="sliderOv">
      Solape: <span id="labelOv">0.30</span>
    </label>
    <input type="range" id="sliderOv" min="0" max="1" step="0.01" value="0.30" />
  </div>

  <!-- Canvas donde pintamos la imagen y detecciones -->
  <canvas id="canvas"></canvas>

  <!-- Botón procesar manual (opcional) -->
  <div id="botonera">
    <button id="botonAccion">Procesar</button>
  </div>
